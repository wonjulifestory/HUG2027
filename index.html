<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HUG 2027 — Program &amp; My Schedule</title>
  <meta name="description" content="The International Symposium on Helicobacter and Upper Gastrointestinal Diseases (March 18–20, 2027, Hyatt Regency Incheon Paradise City)" />
  <meta name="theme-color" content="#B80F49" />

  <!-- PWA & iOS Home Screen Meta -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HUG 2027" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    :root {
      --hug-crimson: #B80F49;
      --hug-crimson-soft: #FDF0F4;
      --hug-crimson-border: #F5C6D6;
      --hug-navy: #162B5B;
      --hug-navy-soft: #EDF1F8;
      --hug-teal: #1A6D82;
      --hug-green: #0F6A3B;
      --hug-coral: #E66E51;
      --hug-charcoal: #263238;
      --hug-slate: #546E7A;
      --hug-border: #E5E7EB;
      --hug-bg: #F6F5F8;

      /* Pastel Session Block Colors */
      --pastel-crimson: #FDEEF3;
      --pastel-green: #ECF7F0;
      --pastel-navy: #EEF2FA;
      --pastel-teal: #E9F6F8;
      --pastel-yellow: #FFFDEB;
      --pastel-purple: #F4EEF9;
      --pastel-gray: #FFFFFF;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--hug-bg);
      color: var(--hug-charcoal);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      background: var(--hug-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 32px rgba(22, 43, 91, 0.06);
    }

    /* Sticky Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #FFFFFF;
      border-bottom: 1px solid var(--hug-border);
      padding-top: env(safe-area-inset-top);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      gap: 10px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .brand-logo {
      height: 22px;
      width: auto;
      display: block;
    }

    .brand-date-pill {
      font-size: 11px;
      font-weight: 700;
      color: var(--hug-navy);
      background: var(--hug-navy-soft);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .lang-btn {
      border: 1.5px solid var(--hug-crimson);
      background: #FFFFFF;
      color: var(--hug-crimson);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .lang-btn:active {
      background: var(--hug-crimson);
      color: #FFFFFF;
    }

    /* HUG Official Navy -> Crimson Accent Strip */
    .sub-bar {
      background: linear-gradient(90deg, #162B5B 0%, #B80F49 100%);
      color: #FFFFFF;
      padding: 10px 16px 12px;
    }
    .sub-bar.hidden { display: none; }

    .page-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      font-size: 11.5px;
      opacity: 0.92;
      margin-top: 2px;
    }

    .search-box {
      margin-top: 10px;
      position: relative;
    }
    .search-input {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 9px 34px 9px 12px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--hug-charcoal);
      outline: none;
    }
    .search-input::placeholder { color: #78909C; }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #78909C;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      display: none;
    }
    .search-clear.visible { display: block; }

    /* Install Banner */
    .install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--hug-crimson-soft);
      border-bottom: 1px solid var(--hug-crimson-border);
      padding: 9px 14px;
      font-size: 12px;
      color: var(--hug-charcoal);
    }
    .install-banner.show { display: flex; }
    .install-btn {
      background: var(--hug-crimson);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .install-close {
      background: transparent;
      border: none;
      color: #78909C;
      font-size: 15px;
      padding: 2px 4px;
      cursor: pointer;
    }

    /* Day Tabs */
    .day-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #F2F3F6;
      border-bottom: 1px solid var(--hug-border);
    }
    .day-tab {
      border: none;
      background: transparent;
      padding: 10px 6px;
      cursor: pointer;
      text-align: center;
      color: var(--hug-slate);
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
    }
    .day-tab.active {
      background: #FFFFFF;
      color: var(--hug-crimson);
      font-weight: 800;
      border-bottom-color: var(--hug-crimson);
    }
    .day-tab-main { font-size: 13px; font-weight: 700; }
    .day-tab-sub { font-size: 11px; margin-top: 2px; opacity: 0.85; }

    /* Filter Chips */
    .chip-row {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--hug-border);
      overflow-x: auto;
    }
    .chip {
      border: 1px solid #CFD8DC;
      background: #FFFFFF;
      color: var(--hug-slate);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--hug-navy);
      border-color: var(--hug-navy);
      color: #FFFFFF;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 14px 14px calc(86px + env(safe-area-inset-bottom));
    }

    /* HOME SCREEN — Minimal & Clean (No Hotel Photo, Fits One Screen) */
    .home-wrap {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-top: 8px;
    }
    .home-hero {
      background: linear-gradient(135deg, #162B5B 0%, #B80F49 100%);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 26px 20px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(184, 15, 73, 0.16);
    }
    .home-hero-kicker {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 11px;
      border-radius: 999px;
    }
    .home-hero-theme {
      font-size: 17.5px;
      font-weight: 800;
      color: #FFFFFF;
      margin-top: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
    }
    .home-hero-meta {
      margin-top: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
    }

    /* 3 Main Icon Tiles on Home Screen */
    .home-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .home-tile {
      background: #FFFFFF;
      border: 1px solid var(--hug-border);
      border-radius: 20px;
      padding: 22px 8px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      transition: transform 0.12s ease;
    }
    .home-tile:active { transform: scale(0.96); }
    .home-tile-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-program .home-tile-icon { background: var(--pastel-navy); color: var(--hug-navy); }
    .tile-my .home-tile-icon      { background: var(--pastel-crimson); color: var(--hug-crimson); }
    .tile-info .home-tile-icon    { background: var(--pastel-teal); color: var(--hug-teal); }

    .home-tile-label {
      font-size: 14px;
      font-weight: 800;
      color: var(--hug-charcoal);
      text-align: center;
      letter-spacing: -0.02em;
    }
    .home-tile-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--hug-crimson);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 22px;
      text-align: center;
    }

    /* LIVE Now / Up Next Card */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .live-card {
      background: #FFFFFF;
      border: 1.5px solid var(--hug-crimson-border);
      border-radius: 18px;
      padding: 13px 15px;
      box-shadow: 0 4px 14px rgba(184, 15, 73, 0.09);
    }
    .live-card.upcoming {
      border-color: #DCE4F2;
      box-shadow: 0 4px 14px rgba(22, 43, 91, 0.07);
    }
    .live-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #FFFFFF;
      background: #E11D48;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .live-pill.next { background: var(--hug-crimson); }
    .live-pill.dday { background: var(--hug-navy); }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FFFFFF;
      animation: pulseDot 1.3s infinite ease-in-out;
    }
    .live-clock {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--hug-slate);
      font-variant-numeric: tabular-nums;
    }
    .live-item {
      padding: 9px 11px;
      border-radius: 12px;
      background: var(--hug-crimson-soft);
      border: 1px solid var(--hug-crimson-border);
      cursor: pointer;
      margin-top: 6px;
    }
    .live-item.next-item {
      background: var(--hug-navy-soft);
      border-color: #DCE4F2;
    }
    .live-item-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #111827;
      line-height: 1.35;
    }
    .live-item-meta {
      font-size: 11.5px;
      color: #455A64;
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .live-progress {
      height: 4px;
      background: #FDE2E7;
      border-radius: 999px;
      margin-top: 7px;
      overflow: hidden;
    }
    .live-progress-bar {
      height: 100%;
      background: #E11D48;
      border-radius: 999px;
    }
    .sim-btn {
      border: 1px solid #DCE4F2;
      background: var(--hug-navy-soft);
      color: var(--hug-navy);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
    }
    .session-card.is-live {
      border: 2px solid #E11D48;
      border-left: 6px solid #E11D48;
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.16);
    }
    .live-inline-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: #E11D48;
      color: #FFFFFF;
    }

    /* Home Screen Extended Sections */
    .home-dday-card {
      background: #FFFFFF;
      border: 1px solid var(--hug-border);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }
    .dday-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .dday-pill {
      background: linear-gradient(135deg, var(--hug-crimson) 0%, #D91B5C 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 12px;
      border-radius: 12px;
      letter-spacing: -0.02em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 4px 10px rgba(184, 15, 73, 0.2);
    }
    .dday-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--hug-navy);
      line-height: 1.3;
    }
    .dday-sub {
      font-size: 11.5px;
      color: var(--hug-slate);
      margin-top: 2px;
    }

    .home-card {
      background: #FFFFFF;
      border: 1px solid var(--hug-border);
      border-radius: 18px;
      padding: 15px 16px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }
    .home-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .home-card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--hug-navy);
      letter-spacing: -0.02em;
    }
    .home-link-btn {
      border: none;
      background: transparent;
      color: var(--hug-crimson);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
    }

    .glance-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .glance-row {
      width: 100%;
      text-align: left;
      border: 1px solid #EAEEF4;
      background: #FAFBFD;
      border-radius: 14px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.12s ease;
    }
    .glance-row:active {
      background: var(--hug-navy-soft);
      transform: scale(0.99);
    }
    .glance-day-badge {
      flex-shrink: 0;
      min-width: 62px;
      text-align: center;
      background: var(--hug-navy);
      color: #FFFFFF;
      border-radius: 10px;
      padding: 6px 6px;
    }
    .glance-day-badge.d2 { background: var(--hug-crimson); }
    .glance-day-badge.d3 { background: var(--hug-teal); }
    .glance-day-num {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.1;
    }
    .glance-day-date {
      font-size: 10px;
      opacity: 0.9;
      margin-top: 2px;
    }
    .glance-body {
      flex: 1;
      min-width: 0;
    }
    .glance-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--hug-charcoal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .glance-sub {
      font-size: 11.5px;
      color: var(--hug-slate);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .glance-chevron {
      color: #90A4AE;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .featured-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .featured-item {
      border: 1px solid var(--hug-border);
      border-left: 4px solid var(--hug-crimson);
      border-radius: 14px;
      padding: 11px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.12s ease;
    }
    .featured-item:active { transform: scale(0.99); }
    .featured-meta {
      font-size: 11px;
      font-weight: 700;
      color: var(--hug-navy);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .featured-title {
      font-size: 13px;
      font-weight: 800;
      color: #111827;
      margin-top: 4px;
      line-height: 1.35;
    }

    .deadline-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .deadline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 12px;
      background: var(--hug-navy-soft);
      font-size: 12.5px;
    }
    .deadline-label {
      font-weight: 700;
      color: var(--hug-charcoal);
    }
    .deadline-date {
      font-weight: 800;
      color: var(--hug-crimson);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .home-venue-strip {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .home-venue-info {
      font-size: 12.5px;
      color: var(--hug-slate);
      line-height: 1.5;
    }
    .home-venue-info b {
      color: var(--hug-navy);
      font-size: 13.5px;
    }

    .home-footer {
      text-align: center;
      padding: 6px 8px 4px;
      color: #78909C;
      font-size: 11px;
      line-height: 1.55;
    }
    .home-footer b {
      color: var(--hug-navy);
      font-weight: 700;
    }
    .version-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--hug-navy);
      background: var(--hug-navy-soft);
      border: 1px solid #DCE4F2;
      padding: 2px 9px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* Session Cards */
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .session-card {
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid var(--hug-border);
      border-left: 5px solid var(--hug-crimson);
      padding: 13px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
    }
    .session-card:active { transform: scale(0.99); }
    .session-card.saved {
      box-shadow: 0 3px 12px rgba(184, 15, 73, 0.13);
      border-color: var(--hug-crimson-border);
    }

    .tone-crimson { background: var(--pastel-crimson); border-left-color: #B80F49; }
    .tone-navy    { background: var(--pastel-navy);    border-left-color: #162B5B; }
    .tone-green   { background: var(--pastel-green);   border-left-color: #0F6A3B; }
    .tone-teal    { background: var(--pastel-teal);    border-left-color: #1A6D82; }
    .tone-yellow  { background: var(--pastel-yellow);  border-left-color: #D4A017; }
    .tone-purple  { background: var(--pastel-purple);  border-left-color: #7E57C2; }
    .tone-gray    { background: #FFFFFF;               border-left-color: #90A4AE; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .time-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--hug-navy);
      font-variant-numeric: tabular-nums;
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--hug-charcoal);
      border: 1px solid rgba(22, 43, 91, 0.1);
    }

    .kj-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--hug-green);
      color: #FFFFFF;
    }

    .conflict-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--hug-crimson);
      color: #FFFFFF;
    }

    .star-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #90A4AE;
      font-size: 19px;

    function toMin(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    // --- Real-Time Schedule Detection (KST / Asia/Seoul) ---
    const DAY_DATES = { 1: '2027-03-18', 2: '2027-03-19', 3: '2027-03-20' };
    let simLiveMode = false;

    function getCurrentKstParts() {
      if (simLiveMode) {
        return { dateStr: '2027-03-19', hhmm: '13:45', mins: 13 * 60 + 45 };
      }
      const now = new Date();
      try {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Seoul',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(now);
        const map = {};
        parts.forEach((p) => { map[p.type] = p.value; });
        const h = Number(map.hour === '24' ? '0' : map.hour);
        const m = Number(map.minute);
        return {
          dateStr: `${map.year}-${map.month}-${map.day}`,
          hhmm: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`,
          mins: h * 60 + m
        };
      } catch (_) {
        const y = now.getFullYear(), mo = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
        const h = now.getHours(), m = now.getMinutes();
        return { dateStr: `${y}-${mo}-${d}`, hhmm: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`, mins: h * 60 + m };
      }
    }

    function getLiveState() {
      const kst = getCurrentKstParts();
      const activeDay = Number(Object.keys(DAY_DATES).find((k) => DAY_DATES[k] === kst.dateStr)) || 0;

      if (activeDay > 0) {
        const todaySessions = SESSIONS.filter((s) => s.day === activeDay).sort((a, b) => toMin(a.start) - toMin(b.start));
        const liveNow = todaySessions.filter((s) => kst.mins >= toMin(s.start) && kst.mins < toMin(s.end));
        if (liveNow.length > 0) return { status: 'LIVE', day: activeDay, kst, items: liveNow };
        const upNext = todaySessions.filter((s) => toMin(s.start) > kst.mins);
        if (upNext.length > 0) {
          const nextStart = upNext[0].start;
          return { status: 'UP_NEXT', day: activeDay, kst, items: upNext.filter((s) => s.start === nextStart), diffMin: toMin(nextStart) - kst.mins };
        }
        if (activeDay < 3) {
          const tomorrowFirst = SESSIONS.filter((s) => s.day === activeDay + 1).sort((a, b) => toMin(a.start) - toMin(b.start))[0];
          return { status: 'UP_NEXT', day: activeDay + 1, kst, items: tomorrowFirst ? [tomorrowFirst] : [], diffMin: null };
        }
        return { status: 'AFTER', day: 3, kst, items: [] };
      }

      if (kst.dateStr < DAY_DATES[1]) {
        const d1 = new Date(DAY_DATES[1] + 'T00:00:00+09:00');
        const dn = new Date(kst.dateStr + 'T00:00:00+09:00');
        const dday = Math.max(1, Math.round((d1 - dn) / 86400000));
        return { status: 'BEFORE', day: 1, kst, dday, items: [SESSIONS[1]] };
      }
      return { status: 'AFTER', day: 3, kst, items: [] };
    }

      simLiveMode = !simLiveMode;
      if (simLiveMode) selectedDay = 2;
      render();
    }

        let roomSimMode = false;

    function getEffectiveKst() {
      if (roomSimMode) {
        return { dateStr: '2027-03-19', hhmm: '13:45', mins: 825 };
      }
      return getCurrentKstParts();
    }

    function renderRoomBoardForDay(dayNum, kst, isKo) {
      const daySessions = SESSIONS.filter((s) => s.day === dayNum).sort((a, b) => toMin(a.start) - toMin(b.start));
      const rooms = [...new Set(daySessions.map((s) => s.room))];
      const rows = rooms.map((room) => {
        const rs = daySessions.filter((s) => s.room === room);
        const live = rs.find((s) => kst.mins >= toMin(s.start) && kst.mins < toMin(s.end));
        if (live) {
          const total = Math.max(1, toMin(live.end) - toMin(live.start));
          const pct = Math.min(100, Math.max(5, Math.round(((kst.mins - toMin(live.start)) / total) * 100)));
          const rem = Math.max(1, toMin(live.end) - kst.mins);
          return {
            rank: 0,
            html: '<div class="room-row is-live" onclick="openDetail(\'' + live.id + '\')">' +
              '<div class="room-row-top">' +
                '<span class="room-name">📍 ' + room + '</span>' +
                '<span class="room-status live">● ' + (isKo ? '진행 중 ' + pct + '%' : 'LIVE ' + pct + '%') + '</span>' +
              '</div>' +
              '<div class="room-session-title">' + live.title + '</div>' +
              '<div class="room-session-time"><span>🕒 ' + live.start + '–' + live.end + '</span><span>' + (isKo ? rem + '분 남음' : rem + 'm left') + '</span></div>' +
              '<div class="live-progress"><div class="live-progress-bar" style="width:' + pct + '%;"></div></div>' +
            '</div>'
          };
        }
        const next = rs.find((s) => toMin(s.start) > kst.mins);
        if (next) {
          const wait = toMin(next.start) - kst.mins;
          return {
            rank: 1,
            html: '<div class="room-row is-next" onclick="openDetail(\'' + next.id + '\')">' +
              '<div class="room-row-top">' +
                '<span class="room-name">📍 ' + room + '</span>' +
                '<span class="room-status next">⏳ ' + (isKo ? wait + '분 후' : 'in ' + wait + 'm') + '</span>' +
              '</div>' +
              '<div class="room-session-title">' + next.title + '</div>' +
              '<div class="room-session-time"><span>🕒 ' + next.start + '–' + next.end + '</span><span>' + (isKo ? '다음 일정' : 'Up Next') + '</span></div>' +
            '</div>'
          };
        }
        const last = rs[rs.length - 1];
        return {
          rank: 2,
          html: '<div class="room-row" onclick="openDetail(\'' + last.id + '\')">' +
            '<div class="room-row-top">' +
              '<span class="room-name">📍 ' + room + '</span>' +
              '<span class="room-status done">✓ ' + (isKo ? '종료' : 'Ended') + '</span>' +
            '</div>' +
            '<div class="room-session-title" style="color:#64748B;">' + last.title + '</div>' +

    async function forceRefresh() {
      showToast(lang === 'ko' ? '최신 버전 불러오는 중...' : 'Checking for updates...');
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.update()));
        }
      } catch (_) {}
      const u = new URL(window.location.href);
      u.searchParams.set('v', Date.now());
      window.location.replace(u.toString());
    }

          <div class="timeline">
            ${dayItems.map((s) => {
              const conflict = hasConflict(s, dayItems);
              return `
                <div class="timeline-item">
                  <div class="timeline-dot ${conflict ? 'conflict' : ''}"></div>
                  <article class="session-card tone-${s.tone}" onclick="openDetail('${s.id}')">
                    <div class="card-top">
                      <div class="badges">
                        <span class="time-badge">${s.start} – ${s.end}</span>
                        <span class="cat-badge">${s.category}</span>
                        ${conflict ? `<span class="conflict-badge">⚠ ${t.conflict}</span>` : ''}
                      </div>
                      <button class="star-btn saved" onclick="toggleSave('${s.id}', event)" aria-label="Remove">★</button>
                    </div>
                    <div class="card-title">${s.title}</div>
                    <div class="card-footer">
                      <span>📍 ${s.room}</span>
                      ${s.kj ? `<span class="kj-badge">${t.kjBadge}</span>` : `<span class="card-more">${t.details}</span>`}
                    </div>
                  </article>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      // INFO TAB (No Hotel Photo)
      main.innerHTML = `
        <section class="venue-card">
          <div class="venue-body">
            <div class="venue-kicker">${t.venueKicker}</div>
            <div class="venue-name">${t.venueName}</div>
            <div class="venue-addr">${t.venueAddr}</div>
            <div class="btn-grid">
              <a class="action-btn action-primary" target="_blank" rel="noopener"
                 href="https://maps.google.com/?q=Hyatt+Regency+Incheon+Paradise+City">🗺 ${t.openGoogleMap}</a>
              <button class="action-btn action-soft" onclick="copyAddress()">📋 ${t.copyAddr}</button>
              <a class="action-btn action-outline" target="_blank" rel="noopener"
                 href="https://map.naver.com/p/search/%ED%95%98%EC%96%8F%ED%8A%B8%20%EB%A6%AC%EC%A0%A0%EC%8B%9C%20%EC%9D%B8%EC%B2%9C">🟢 ${t.openNaverMap}</a>
              <a class="action-btn action-outline" target="_blank" rel="noopener"
                 href="https://map.kakao.com/?q=%ED%95%98%EC%96%8F%ED%8A%B8%20%EB%A6%AC%EC%A0%A0%EC%8B%9C%20%EC%9D%B8%EC%B2%9C">🟡 ${t.openKakaoMap}</a>
            </div>
          </div>
        </section>

        <section class="venue-card">
          <div class="venue-body">
            <div class="section-heading"><span>🗓 ${t.datesTitle}</span></div>
            <div class="hall-box">
              <div class="hall-desc" style="margin-top:0;line-height:1.7;">
                <div>• ${t.date1}</div>
                <div>• ${t.date2}</div>
                <div>• ${t.date3}</div>
              </div>
            </div>
          </div>
        </section>

        <section class="venue-card">
          <div class="venue-body">
            <div class="section-heading">
              <span>🚌 ${t.shuttleTitle}</span>
              <span class="kj-badge">${t.shuttleInterval}</span>
            </div>
            <div class="hall-desc" style="margin-top:0;line-height:1.7;">
              <div>• <b>${t.shuttleT1}</b></div>
              <div>• <b>${t.shuttleT2}</b></div>
              <div>• ${t.shuttleDrop}</div>
            </div>
          </div>
        </section>

        <section class="venue-card">
          <div class="venue-body">
            <div class="section-heading"><span>🌐 ${t.officialTitle}</span></div>
            <div class="hall-desc" style="margin-top:0;margin-bottom:10px;">
              Tel: +82-2-6677-0542 · hug@helicobacterkorea.org
            </div>
            <div class="btn-grid" style="margin-top:0;">
              <a class="action-btn action-primary" target="_blank" rel="noopener" href="https://www.helicobacterkorea.org">${t.openWeb}</a>
              <a class="action-btn action-soft" href="mailto:hug@helicobacterkorea.org">✉ ${t.emailSec}</a>
            </div>
          </div>
        </section>

        <footer class="home-footer">
          <div><b>${t.footerOrg}</b></div>
          <div><span class="version-badge">HUG 2027 App ${APP_VERSION}</span></div>
        </footer>
      `;
    }

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      const shellEl = document.querySelector('.app-shell');
      if (shellEl) shellEl.classList.toggle('is-home', currentTab === 'home');
      document.getElementById('langToggleBtn').textContent = lang === 'ko' ? 'EN' : '한국어';
      document.getElementById('savedCountBadge').textContent = savedIds.size;

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      const subHeader = document.getElementById('subHeader');
      const dayTabsEl = document.getElementById('dayTabsContainer');
      const filterEl = document.getElementById('filterContainer');

      if (currentTab === 'home') {
        subHeader.classList.add('hidden');
        subHeader.innerHTML = '';
        dayTabsEl.innerHTML = '';
        filterEl.innerHTML = '';
      } else if (currentTab === 'program') {
        subHeader.classList.remove('hidden');
        subHeader.innerHTML = `
          <div class="page-title">${t.programTitle}</div>
          <div class="page-subtitle">${t.programSub}</div>
          <div class="search-box">
            <input id="programSearchInput" class="search-input" type="search"
              placeholder="${t.searchPlaceholder}" value="${searchQuery.replace(/"/g, '&quot;')}"
              oninput="setSearch(this.value)" />
            <button id="searchClearBtn" class="search-clear ${searchQuery ? 'visible' : ''}" onclick="clearSearch()">✕</button>
          </div>
        `;
        dayTabsEl.innerHTML = renderDayTabsHTML(selectedDay, 'setProgramDay', false);
        filterEl.innerHTML = `
          <div class="chip-row">
            <button class="chip ${trackFilter === 'ALL' ? 'active' : ''}" onclick="setTrackFilter('ALL')">${t.allTracks}</button>
            <button class="chip ${trackFilter === 'SYMP' ? 'active' : ''}" onclick="setTrackFilter('SYMP')">${t.trackSymp}</button>
            <button class="chip ${trackFilter === 'KJ' ? 'active' : ''}" onclick="setTrackFilter('KJ')">${t.trackKJ}</button>
            <button class="chip ${trackFilter === 'SPEC' ? 'active' : ''}" onclick="setTrackFilter('SPEC')">${t.trackSpec}</button>
          </div>
        `;
      } else if (currentTab === 'my') {
        subHeader.classList.remove('hidden');
        subHeader.innerHTML = `
          <div class="page-title">${t.myTitle}</div>
          <div class="page-subtitle">${t.mySub}</div>
          <div class="summary-grid">
            ${[1, 2, 3].map((d) => {
              const cnt = SESSIONS.filter((s) => s.day === d && savedIds.has(s.id)).length;
              return `
                <div class="summary-pill ${mySelectedDay === d ? 'active' : ''}" onclick="setMyDay(${d})">
                  <div class="summary-pill-day">${t.days[d].short}</div>
                  <div class="summary-pill-num">${cnt}${t.savedUnit}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        dayTabsEl.innerHTML = renderDayTabsHTML(mySelectedDay, 'setMyDay', true);
        filterEl.innerHTML = '';
      } else {
        subHeader.classList.remove('hidden');
        subHeader.innerHTML = `
          <div class="page-title">${t.venueTitle}</div>
          <div class="page-subtitle">${t.venueSub}</div>
        `;
        dayTabsEl.innerHTML = '';
        filterEl.innerHTML = '';
      }

      renderBodyOnly();
    }

    // --- PWA Install & Service Worker ---
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    let installDismissed = false;

    function updateInstallBanner() {
      const banner = document.getElementById('installBanner');
      const msg = document.getElementById('installMsg');
      const btn = document.getElementById('installActionBtn');
      if (isStandalone || installDismissed) {
        banner.classList.remove('show');
        return;
      }
      if (deferredPrompt) {
        msg.textContent = T[lang].androidInstall;
        btn.textContent = T[lang].installBtn;
        btn.style.display = 'inline-block';
        banner.classList.add('show');
      } else if (isIOS) {
        msg.textContent = T[lang].iosInstall;
        btn.style.display = 'none';
        banner.classList.add('show');
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      updateInstallBanner();
    });

    function triggerInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(() => {
        deferredPrompt = null;
        updateInstallBanner();
      });
    }

    function dismissInstall() {
      installDismissed = true;
      updateInstallBanner();
    }

    if ('serviceWorker' in navigator) {
      let swReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swReloading) return;
        swReloading = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch(() => {});
      });
    }

    render();
    updateInstallBanner();
    setInterval(() => {
      if (currentTab === 'home' || currentTab === 'program') renderBodyOnly();
    }, 60000);
  </script>
</body>
</html>
